name: Postman API Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Newman and Reporters
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Postman Collection
        run: |
              newman run "Bank Mock API.postman_collection.json" \
              --env-var "BASE_URL=http://localhost:4500" \
              -r cli,json,junit,htmlextra \
              --reporter-json-export reports/newman-report.json \
              --reporter-junit-export reports/newman-report.xml \
              --reporter-htmlextra-export reports/newman-report.html


      - name: Upload Newman Reports
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-report
          path: reports/
